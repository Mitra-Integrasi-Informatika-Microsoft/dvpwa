name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mitra-integrasi-informatika-microsoft/dvpwa

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [app, db]
        include:
          - component: app
            dockerfile: Dockerfile.app
          - component: db
            dockerfile: Dockerfile.db
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local image for scanning
        id: build-local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: false
          limit-severities-for-sarif: true

      - name: Upload Trivy image scan SARIF report
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}

      - name: Build and push container image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  iac-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: 0

      - name: Upload Trivy config scan SARIF report
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # Deploy and DAST run on the homelab self-hosted runner. The runner group only
  # accepts this workflow from refs/heads/master, and these jobs never run for
  # pull requests. The production environment requires an approver.
  deploy:
    needs: [build-and-scan, iac-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, homelab, deploy]
    environment:
      name: production
      url: http://10.10.10.13:8080
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout deploy manifest only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: true

      - name: Log in to GHCR
        run: echo "$GH_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify build provenance before deploying
        run: |
          for c in app db; do
            gh attestation verify "oci://${IMAGE_PREFIX}-${c}:${IMAGE_TAG}" --repo "${{ github.repository }}"
          done

      - name: Deploy stack
        run: |
          podman-compose -p dvpwa -f deploy/compose.prod.yml pull
          podman-compose -p dvpwa -f deploy/compose.prod.yml up -d

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$code" = "200" ] && { echo "App is up (HTTP 200)"; exit 0; }
            sleep 2
          done
          echo "App did not become healthy"; podman-compose -p dvpwa -f deploy/compose.prod.yml logs --tail 50; exit 1

      - name: Log out of GHCR
        if: always()
        run: podman logout ghcr.io || true

  dast:
    needs: deploy
    runs-on: [self-hosted, homelab, deploy]
    permissions:
      contents: read
    steps:
      - name: ZAP baseline scan
        run: |
          rm -rf "$RUNNER_TEMP/zap" && mkdir -p "$RUNNER_TEMP/zap"
          # -I: report findings without failing the job (the app is vulnerable on purpose)
          podman run --rm --network host --userns=keep-id \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080 -r zap.html -J zap.json -I

      - name: Summarize findings
        if: always()
        run: |
          f="$RUNNER_TEMP/zap/zap.json"
          [ -f "$f" ] || { echo "No ZAP report produced" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## ZAP baseline (DAST) against production"
            echo "| Risk | Alert | Instances |"
            echo "|---|---|---|"
            jq -r '.site[].alerts[] | "| \(.riskdesc | split(" ")[0]) | \(.name) | \(.count) |"' "$f"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap/
